<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shuhrat Abrorov | Xalqaro Konsultant</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --izumrud: #008f68;
            --oq: #ffffff;
            --bg-light: #f1f5f9;
            --dark-green: #004d3d;
            --warning: #fbbf24;
        }

        body {
            background-color: var(--bg-light);
            color: var(--dark-green);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            padding-bottom: 100px; /* Savatcha uchun joy */
        }

        /* 1. Uzluksiz Reklama Slideri (Marquee) */
        .promo-slider {
            background: #fff;
            height: 140px;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            border-bottom: 2px solid var(--izumrud);
        }
        .promo-track {
            display: inline-block;
            animation: marquee 30s linear infinite;
        }
        .promo-track img {
            height: 140px;
            width: 300px;
            object-fit: cover;
            margin-right: 5px;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 2. Profil va Header Section */
        .profile-header {
            background: linear-gradient(180deg, var(--izumrud) 0%, #006d4e 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .warn-icon { font-size: 32px; color: var(--warning); display: block; margin-bottom: 10px; }
        .balance-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 20px;
            margin-top: 15px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* 3. Ob-havo Vidjeti */
        .weather-card {
            background: white;
            margin: -25px 20px 20px;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .weather-info h4 { margin: 0; color: #64748b; font-size: 0.85rem; }
        .weather-temp { font-size: 2.4rem; font-weight: 800; color: var(--izumrud); margin: 5px 0; }
        .weather-warn { color: var(--warning); font-size: 24px; }

        /* 4. Play Market uslubidagi Kitoblar */
        .section-title {
            padding: 10px 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .books-scroll {
            display: flex;
            overflow-x: auto;
            padding: 10px 20px;
            gap: 15px;
            scrollbar-width: none;
        }
        .books-scroll::-webkit-scrollbar { display: none; }
        .book-card {
            min-width: 150px;
            background: white;
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: 0.3s;
        }
        .book-card img { width: 100%; height: 180px; border-radius: 15px; object-fit: cover; }
        .book-name { font-size: 0.9rem; font-weight: 600; margin: 10px 0 5px; height: 38px; overflow: hidden; }
        .book-price { color: var(--izumrud); font-weight: 800; font-size: 0.95rem; }

        /* 5. Savatcha Pastki qismi */
        .cart-footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        .buy-btn {
            background-color: var(--izumrud);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(0,143,104,0.3);
        }
        .buy-btn:active { transform: scale(0.96); }

        /* Kategoriyalar Grid */
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }
        .cat-item {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
    </style>
</head>
<body>

    <!-- Reklama Slideri -->
    <div class="promo-slider">
        <div class="promo-track" id="promoTrack">
            <!-- Botdagi 'ads' papkasidagi rasmlarni bu yerga link qiling -->
            <img src="https://via.placeholder.com/600x280/008f68/ffffff?text=SHUHRAT+ABROROV+REKLAMA+1">
            <img src="https://via.placeholder.com/600x280/004d3d/ffffff?text=KONSULTATSIYA+XIZMATI">
            <img src="https://via.placeholder.com/600x280/00b386/ffffff?text=YANGI+KITOBLAR+2026">
            <!-- Qaytariluvchi qism (uzluksizlik uchun) -->
            <img src="https://via.placeholder.com/600x280/008f68/ffffff?text=SHUHRAT+ABROROV+REKLAMA+1">
        </div>
    </div>

    <!-- Profil va Balans -->
    <div class="profile-header">
        <span class="warn-icon">⚠️</span>
        <h2 id="user-name">Foydalanuvchi</h2>
        <p style="opacity: 0.9; margin: 5px 0;">Shuhrat Abrorov | Xalqaro konsultant</p>
        <div class="balance-card">
            UZS: <span id="balance-val">0</span>
        </div>
    </div>

    <!-- Ob-havo Vidjeti -->
    <div class="weather-card">
        <div>
            <h4>Toshkent, Bugun</h4>
            <div class="weather-temp">+24°C</div>
            <div style="color: var(--izumrud); font-size: 0.8rem; font-weight: 600;">● Havo ochiq, purkash uchun qulay</div>
        </div>
        <span class="weather-warn">⚠️</span>
    </div>

    <!-- Kitoblar Section -->
    <div class="section-title">
        <span>📚 Tavsiya etilgan kitoblar</span>
        <a href="#" style="color: var(--izumrud); text-decoration: none; font-size: 0.85rem;">Hammasi</a>
    </div>
    <div class="books-scroll">
        <!-- Kitob 1 -->
        <div class="book-card">
            <img src="https://images.unsplash.com/photo-1615485242231-97992954a732?q=80&w=300&h=400&fit=crop">
            <div class="book-name">Olma yetishtirish sirlari</div>
            <div class="book-price">UZS: 45 000</div>
            <button class="buy-btn" style="width: 100%; margin-top: 10px; font-size: 0.8rem;" onclick="addToCart('Olma kitobi', 45000)">Savatchaga</button>
        </div>
        <!-- Kitob 2 -->
        <div class="book-card">
            <img src="https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?q=80&w=300&h=400&fit=crop">
            <div class="book-name">Zamonaviy Issiqxonalar</div>
            <div class="book-price">UZS: 60 000</div>
            <button class="buy-btn" style="width: 100%; margin-top: 10px; font-size: 0.8rem;" onclick="addToCart('Issiqxona kitobi', 60000)">Savatchaga</button>
        </div>
    </div>

    <!-- Xizmatlar -->
    <div class="section-title"><span>📂 Xizmatlar</span></div>
    <div class="categories-grid">
        <div class="cat-item">🧪 <b>Analiz</b></div>
        <div class="cat-item">👨‍🌾 <b>Maslahat</b></div>
    </div>

    <!-- Savatcha Footer -->
    <div class="cart-footer">
        <div>
            <p style="margin: 0; font-size: 0.75rem; color: #64748b;">Umumiy hisob:</p>
            <b id="total-price" style="font-size: 1.1rem;">UZS: 0</b>
        </div>
        <button class="buy-btn" onclick="completePurchase()">Sotib olish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // Telegramdan ma'lumotlarni olish
        const userName = tg.initDataUnsafe.user?.first_name || "Mehmon";
        document.getElementById('user-name').innerText = userName;

        let totalCartAmount = 0;

        function addToCart(name, price) {
            totalCartAmount += price;
            document.getElementById('total-price').innerText = "UZS: " + totalCartAmount.toLocaleString();
            tg.HapticFeedback.impactOccurred('medium');
        }

        function completePurchase() {
            if (totalCartAmount === 0) {
                tg.showAlert("Savatchangiz bo'sh!");
                return;
            }

            tg.showConfirm(`Jami xarid UZS: ${totalCartAmount.toLocaleString()}. Balansingizdan chegirilsinmi?`, (ok) => {
                if (ok) {
                    // Botga xarid ma'lumotini yuborish
                    tg.sendData(JSON.stringify({
                        action: "buy_books",
                        amount: totalCartAmount
                    }));
                    tg.close();
                }
            });
        }

        // Balansni dinamik o'zgartirish (agar botdan ma'lumot kelsa)
        // Hozircha 0 turadi, bot orqali yangilash mumkin
    </script>
</body>
</html>
