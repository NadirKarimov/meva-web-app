<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitob Bozor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #ddd; }
        .tab-active { color: #2563eb; }
    </style>
</head>
<body class="pb-20">

    <!-- Top Header: Xabarlar va Qidiruv -->
    <header class="p-4 bg-white flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold">Books Store</h1>
        <div class="relative">
            <i class="fas fa-bell text-gray-600 text-xl"></i>
            <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full px-1">3</span>
        </div>
    </header>

    <!-- Asosiy menyu: Banner/Aktsiyalar -->
    <section class="p-4">
        <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl p-4 text-white shadow-lg">
            <p class="text-sm opacity-80">Hafta aksiyasi</p>
            <h2 class="text-lg font-bold">Barcha badiiy kitoblarga -30%</h2>
            <button class="mt-2 bg-white text-blue-600 px-4 py-1 rounded-lg text-sm font-semibold">Ko'rish</button>
        </div>
    </section>

    <!-- Reyting: Ko'p sotilganlar -->
    <section class="px-4 mt-2">
        <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold">Top kitoblar</h3>
            <select class="text-sm bg-transparent border-none font-medium text-blue-600">
                <option>Haftalik</option>
                <option>Oylik</option>
            </select>
        </div>
        
        <div class="flex overflow-x-auto space-x-4 no-scrollbar">
            <!-- Kitob kartochkasi -->
            <div class="min-w-[140px] bg-white p-2 rounded-lg shadow-sm">
                <img src="https://via.placeholder.com/120x160" class="rounded-md mb-2">
                <p class="text-xs font-bold truncate">Atom odatlari</p>
                <p class="text-[10px] text-gray-500">Jeyms Klir</p>
                <div class="flex justify-between items-center mt-1">
                    <span class="text-sm font-bold text-green-600">45,000 s'om</span>
                </div>
            </div>
            <!-- Boshqa kitoblar... -->
        </div>
    </section>

    <!-- Pastki Navigatsiya Bar -->
    <nav class="bottom-nav flex justify-around p-3">
        <div class="text-center tab-active">
            <i class="fas fa-book text-xl"></i>
            <p class="text-[10px]">Kitoblar</p>
        </div>
        <div class="text-center text-gray-400">
            <i class="fas fa-heart text-xl"></i>
            <p class="text-[10px]">Yoqganlar</p>
        </div>
        <div class="text-center text-gray-400">
            <div class="relative inline-block">
                <i class="fas fa-shopping-cart text-xl"></i>
                <span class="absolute -top-2 -right-2 bg-blue-600 text-white text-[8px] rounded-full px-1">2</span>
            </div>
            <p class="text-[10px]">Savatcha</p>
        </div>
        <div class="text-center text-gray-400">
            <i class="fas fa-user text-xl"></i>
            <p class="text-[10px]">Profil</p>
        </div>
    </nav>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Ilovani to'liq ekranga yoyish
    </script>
</body>
</html>
